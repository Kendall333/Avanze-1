<main class="container">

```
<h2>Gestión de Carreras</h2>


<!-- =========================
     FORMULARIO DE CARRERAS
========================== -->

<form id="formCarrera">

    <div class="form-group">

        <label for="nombreCarrera">
            Nombre de la carrera
        </label>

        <input
            type="text"
            id="nombreCarrera"
            placeholder="Ej. Ingeniería de Software"
            required>

    </div>


    <div class="form-group">

        <label for="descripcionCarrera">
            Descripción
        </label>

        <textarea
            id="descripcionCarrera"
            rows="4"
            placeholder="Ingrese una descripción de la carrera"
            required></textarea>

    </div>


    <div
        id="mensajeCarrera"
        class="mensaje">
    </div>


    <div class="form-group full">

        <button type="submit">
            Guardar carrera
        </button>

    </div>

</form>


<hr style="margin:40px 0;">


<!-- =========================
     LISTA DE CARRERAS
========================== -->

<h2>Lista de Carreras</h2>


<table>

    <thead>

        <tr>

            <th>
                Nombre
            </th>

            <th>
                Descripción
            </th>

            <th>
                Acciones
            </th>

        </tr>

    </thead>


    <tbody id="tablaCarreras">

        <!--
            Los registros provenientes
            del servidor aparecerán aquí.
        -->

    </tbody>

</table>
```
