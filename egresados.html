<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestión de Egresados</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

    <div class="logo">

        <img src="assets/img/logo.png" alt="Logo CENFOTEC">

        <h1>CENFOTEC</h1>

    </div>

    <nav>

        <ul>

            <li><a href="index.html">Inicio</a></li>

            <li><a href="login.html">Iniciar sesión</a></li>

            <li><a href="perfil.html">Mi Perfil</a></li>

            <li><a href="egresados.html">Egresados</a></li>

            <li><a href="carreras.html">Carreras</a></li>

        </ul>

    </nav>

</header>


<div class="container">

    <h2>Registro de Egresados</h2>


    <!-- =========================
         FORMULARIO DE EGRESADOS
    ========================== -->

    <form id="formEgresado">

        <div class="form-group">

            <label for="nombre">Nombre completo</label>

            <input
                type="text"
                id="nombre"
                placeholder="Ingrese el nombre completo"
                required>

        </div>


        <div class="form-group">

            <label for="cedula">Identificación</label>

            <input
                type="text"
                id="cedula"
                placeholder="123456789"
                required>

        </div>


        <div class="form-group">

            <label for="correo">Correo electrónico</label>

            <input
                type="email"
                id="correo"
                placeholder="correo@ejemplo.com"
                required>

        </div>


        <div class="form-group">

            <label for="telefono">Teléfono</label>

            <input
                type="text"
                id="telefono"
                placeholder="88888888"
                required>

        </div>


        <div class="form-group">

            <label for="fecha">Fecha de registro</label>

            <input
                type="date"
                id="fecha"
                required>

        </div>


        <!-- =========================
             INFORMACIÓN LABORAL
             CAMPOS OPCIONALES
        ========================== -->

        <div class="form-group">

            <label for="empresa">Empresa actual</label>

            <input
                type="text"
                id="empresa"
                placeholder="Nombre de la empresa">

        </div>


        <div class="form-group">

            <label for="puesto">Puesto actual</label>

            <input
                type="text"
                id="puesto"
                placeholder="Ej. Desarrollador Web">

        </div>


        <div class="form-group">

            <label for="areaProfesional">Área profesional</label>

            <input
                type="text"
                id="areaProfesional"
                placeholder="Ej. Tecnología">

        </div>


        <div class="form-group">

            <label for="linkedin">LinkedIn</label>

            <input
                type="text"
                id="linkedin"
                placeholder="linkedin.com/in/usuario">

        </div>


        <div class="form-group">

            <label for="portafolio">Portafolio</label>

            <input
                type="text"
                id="portafolio"
                placeholder="www.misitio.com">

        </div>


        <div id="mensaje" class="mensaje"></div>


        <div class="form-group full">

            <button type="submit">

                Guardar Egresado

            </button>

        </div>

    </form>


    <hr style="margin:40px 0;">


    <!-- =========================
         LISTA DE EGRESADOS
    ========================== -->

    <h2>Lista de Egresados</h2>


    <table>

        <thead>

            <tr>

                <th>Identificación</th>

                <th>Nombre</th>

                <th>Correo</th>

                <th>Teléfono</th>

                <th>Empresa</th>

                <th>Puesto</th>

                <th>Acciones</th>

            </tr>

        </thead>


        <tbody id="tablaEgresados">

            <!-- Los registros serán cargados mediante JavaScript -->

        </tbody>

    </table>

</div>


<footer>

    <p>

        Universidad CENFOTEC © 2026

        <br>

        Sistema de Gestión de Egresados

    </p>

</footer>


<script src="js/validaciones.js"></script>

</body>

</html>
