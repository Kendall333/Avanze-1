<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestión de Egresados</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

    <div class="logo">

        <img src="assets/img/logo.png" alt="Logo">

        <h1>CENFOTEC</h1>

    </div>

    <nav>

        <ul>

            <li><a href="index.html">Inicio</a></li>

            <li><a href="login.html">Iniciar sesión</a></li>

            <li><a href="perfil.html">Mi Perfil</a></li>

            <li><a href="egresados.html">Egresados</a></li>

            <li><a href="carreras.html">Carreras</a></li>

        </ul>

    </nav>

</header>

<div class="container">

<h2>Registro de Egresados</h2>

<form id="formEgresado">

<div class="form-group">

<label>Nombre completo</label>

<input
type="text"
id="nombre"
placeholder="Ingrese el nombre completo">

</div>

<div class="form-group">

<label>Cédula</label>

<input
type="text"
id="cedula"
placeholder="1-1111-1111">

</div>

<div class="form-group">

<label>Correo electrónico</label>

<input
type="email"
id="correo"
placeholder="correo@ejemplo.com">

</div>

<div class="form-group">

<label>Teléfono</label>

<input
type="text"
id="telefono"
placeholder="88888888">

</div>

<div class="form-group">

<label>Fecha de nacimiento</label>

<input
type="date"
id="fecha">

</div>

<div class="form-group">

<label>Sexo</label>

<select id="sexo">

<option value="">Seleccione</option>

<option>Masculino</option>

<option>Femenino</option>

<option>Prefiero no indicar</option>

</select>

</div>

<div class="form-group">

<label>Carrera</label>

<select id="carrera">

<option value="">Seleccione</option>

<option>Ingeniería del Software</option>

<option>Diseño Web</option>

<option>Administración</option>

<option>Ciberseguridad</option>

<option>Ciencia de Datos</option>

</select>

</div>

<div class="form-group">

<label>Año de graduación</label>

<input
type="number"
id="graduacion"
placeholder="2026">

</div>

<div class="form-group">

<label>Estado laboral</label>

<select id="estado">

<option value="">Seleccione</option>

<option>Empleado</option>

<option>Desempleado</option>

<option>Emprendedor</option>

<option>Estudiante</option>

</select>

</div>

<div class="form-group">

<label>Empresa donde labora</label>

<input
type="text"
id="empresa"
placeholder="Nombre de la empresa">

</div>

<div class="form-group full">

<label>Dirección</label>

<input
type="text"
id="direccion"
placeholder="Dirección completa">

</div>

<div class="form-group full">

<label>Descripción</label>

<textarea
id="descripcion"
placeholder="Información adicional del egresado..."></textarea>

</div>

<div id="mensaje" class="mensaje"></div>

<div class="form-group full">

<button type="submit">

Guardar Egresado

</button>

</div>

</form>

<hr style="margin:40px 0;">

<h2>Lista de Egresados</h2>

<table>

<thead>

<tr>

<th>Nombre</th>

<th>Carrera</th>

<th>Correo</th>

<th>Estado</th>

<th>Acciones</th>

</tr>

</thead>

<tbody id="tablaEgresados">

</tbody>

</table>

</div>

<footer>

<p>

Universidad CENFOTEC © 2026

<br>

Sistema de Gestión de Egresados

</p>

</footer>

<script src="js/validaciones.js"></script>

</body>

</html>
